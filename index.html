<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cv bulder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1>CV Builder</h1>
    <p>Créez votre CV professionnel facilement</p>
</header>

<main>

    <section class="formulaire">
        <h2>Mes informations</h2>

        <label for="nom">Nom complet</label>
        <input type="text" id="nom" placeholder="Ex : Abdoulaye Ridwan">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ex : exemple@gmail.com">

        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" placeholder="Ex : +228 XX XX XX XX">
    </section>

    <section class="apercu">
        <h2>Aperçu du CV</h2>

        <div class="cv">
            <h1>Votre nom</h1>
            <p>Votre email</p>
            <p>Votre téléphone</p>
        </div>
    </section>

</main>
    
</body>
<script src="script.js"></script>
</html>
